name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: alpine:3.21

    steps:
      - name: Install dependencies
        run: apk add --no-cache neovim bash

      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tests
        run: ./bin/test
